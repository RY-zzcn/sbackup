name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -buildvcs=false ./...
      - run: CGO_ENABLED=1 go test -race -buildvcs=false ./...
      - run: go vet -buildvcs=false ./...
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh
      - run: bash -n scripts/*.sh

  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: linux_amd64
          - goos: linux
            goarch: arm64
            asset: linux_arm64
          - goos: linux
            goarch: arm
            goarm: '7'
            asset: linux_armv7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eux
          version="${VERSION#v}"
          out="sbackup_${version}_${{ matrix.asset }}"
          mkdir -p "$out"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${version}" -o "$out/sbackup" ./cmd/sbackup
          cp LICENSE VERSION "$out/"
          (cd "$out" && tar -czf "../$out.tar.gz" .)
          test -s "$out.tar.gz"
          tar -tzf "$out.tar.gz" | grep -qx './sbackup'
          tar -tzf "$out.tar.gz" | grep -qx './VERSION'
          if [[ "${{ matrix.asset }}" == linux_amd64 ]]; then
            test "$("$out/sbackup" version)" = "sbackup ${version}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: sbackup_*_${{ matrix.asset }}.tar.gz

  publish:
    needs: [binaries, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        run: |
          sha256sum sbackup_*.tar.gz > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sbackup_*.tar.gz
            SHA256SUMS
          generate_release_notes: true

  container:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/RY-zzcn/sbackup
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.description=SBackup optional monitoring dashboard
          tags: |
            ghcr.io/ry-zzcn/sbackup-monitor:${{ github.ref_name }}
            ghcr.io/ry-zzcn/sbackup-monitor:latest
